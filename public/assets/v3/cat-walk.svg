<?xml version="1.0" encoding="UTF-8"?>
<!--
  Day & Night cat walk cycle
  4 frames, each 128 × 128 px, arranged left-to-right in a 512 × 128 atlas.
  Transparent background; white silhouette is intentional so a Three.js
  SpriteMaterial can tint it black for Day and white for Night.

  This is original vector artwork made for this portfolio. Its four-frame
  walking rhythm was informed by Noob's CC0 "2D cat sprite" (2017):
  https://opengameart.org/content/2d-cat-sprite
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="128" viewBox="0 0 512 128" role="img" aria-labelledby="title desc" shape-rendering="crispEdges">
  <title id="title">Four-frame walking cat sprite atlas</title>
  <desc id="desc">A transparent, white, monochrome cat silhouette in four walking poses.</desc>

  <!-- Frame 1: rear leg forward / tail lifted -->
  <g id="frame-0" fill="#ffffff">
    <path d="M17 91h12V75h7v-9h8v-7h9v-8h8v-7h8V35h9v9h9V35h9v16h8v8h8v7h7v9h5v16h-8v8h-8v9H78v-9h-8v9H53v-8h-9v-9h-8v9H17z"/>
    <path d="M18 82h-8V64H2V48h8v8h8v9h9v9h-9z"/>
    <path d="M76 35h8V19h8v16h9V19h8v32H76z"/>
    <rect x="99" y="56" width="8" height="8" fill="#1a1a1a"/>
    <path d="M109 73h10v8h-10z" fill="#1a1a1a"/>
    <path d="M85 100h10v9H85z"/>
    <path d="M52 100h10v9H52z"/>
    <path d="M45 109h20v7H45z"/>
    <path d="M82 109h20v7H82z"/>
  </g>

  <!-- Frame 2: gathered stride -->
  <g id="frame-1" transform="translate(128)" fill="#ffffff">
    <path d="M17 91h12V75h7v-9h8v-7h9v-8h8v-7h8V35h9v9h9V35h9v16h8v8h8v7h7v9h5v16h-8v8h-8v9H78v-9h-8v-9H61v9H53v-8h-9v-9h-8v9H17z"/>
    <path d="M18 82h-8V73H2V64h8v-8h8v9h9v9h-9z"/>
    <path d="M76 35h8V19h8v16h9V19h8v32H76z"/>
    <rect x="99" y="56" width="8" height="8" fill="#1a1a1a"/>
    <path d="M109 73h10v8h-10z" fill="#1a1a1a"/>
    <path d="M53 100h10v9H53z"/>
    <path d="M71 100h10v9H71z"/>
    <path d="M46 109h20v7H46z"/>
    <path d="M68 109h20v7H68z"/>
  </g>

  <!-- Frame 3: front leg forward / tail level -->
  <g id="frame-2" transform="translate(256)" fill="#ffffff">
    <path d="M17 91h12V75h7v-9h8v-7h9v-8h8v-7h8V35h9v9h9V35h9v16h8v8h8v7h7v9h5v16h-8v8h-8v9H78v-9h-8v9H53v-8h-9v-9h-8v9H17z"/>
    <path d="M18 82h-8V82H2V73h8v-8h8v9h9v8h-9z"/>
    <path d="M76 35h8V19h8v16h9V19h8v32H76z"/>
    <rect x="99" y="56" width="8" height="8" fill="#1a1a1a"/>
    <path d="M109 73h10v8h-10z" fill="#1a1a1a"/>
    <path d="M85 100h10v9H85z"/>
    <path d="M61 100h10v9H61z"/>
    <path d="M54 109h20v7H54z"/>
    <path d="M82 109h20v7H82z"/>
  </g>

  <!-- Frame 4: gathered stride / tail dipped -->
  <g id="frame-3" transform="translate(384)" fill="#ffffff">
    <path d="M17 91h12V75h7v-9h8v-7h9v-8h8v-7h8V35h9v9h9V35h9v16h8v8h8v7h7v9h5v16h-8v8h-8v9H78v-9h-8v-9H61v9H53v-8h-9v-9h-8v9H17z"/>
    <path d="M18 82h-8V91H2v-9h8v-8h8v-9h9v9h-9z"/>
    <path d="M76 35h8V19h8v16h9V19h8v32H76z"/>
    <rect x="99" y="56" width="8" height="8" fill="#1a1a1a"/>
    <path d="M109 73h10v8h-10z" fill="#1a1a1a"/>
    <path d="M53 100h10v9H53z"/>
    <path d="M71 100h10v9H71z"/>
    <path d="M46 109h20v7H46z"/>
    <path d="M68 109h20v7H68z"/>
  </g>
</svg>
