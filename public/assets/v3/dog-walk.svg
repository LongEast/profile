<?xml version="1.0" encoding="UTF-8"?>
<!--
  Day & Night dog walk cycle
  4 frames, each 128 × 128 px, arranged left-to-right in a 512 × 128 atlas.
  Transparent background with a white silhouette for CSS colour filtering.
  Original vector artwork created for this portfolio.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="128" viewBox="0 0 512 128" role="img" aria-labelledby="title desc" shape-rendering="crispEdges">
  <title id="title">Four-frame walking dog sprite atlas</title>
  <desc id="desc">A transparent, white, monochrome dog silhouette in four walking poses.</desc>

  <defs>
    <g id="dog-body" fill="#ffffff">
      <path d="M22 82V63h9V52h13V45h39v6h10V39h18v7h8v9h7v18h-9v8h-17v12H82v-9H47v9H29V82z"/>
      <path d="M99 40V25h9v8h9v17h-8v12H98V50z"/>
      <path d="M117 55h10v13h-10z"/>
      <rect x="111" y="47" width="6" height="6" fill="#171717"/>
      <path d="M22 67h-8V54H5v-9H0v-8h9v8h9v9h9z"/>
    </g>
  </defs>

  <g id="frame-0">
    <use href="#dog-body"/>
    <path d="M31 84h13v22h13v8H34v-9h-3zM78 84h13v21h15v9H82v-8h-4z" fill="#ffffff"/>
  </g>

  <g id="frame-1" transform="translate(128)">
    <use href="#dog-body"/>
    <path d="M35 84h13v19h9v9H35zM74 84h13v19h10v9H74z" fill="#ffffff"/>
  </g>

  <g id="frame-2" transform="translate(256)">
    <use href="#dog-body"/>
    <path d="M35 84h13v21h15v9H39v-8h-4zM79 84h13v22h13v8H82v-9h-3z" fill="#ffffff"/>
  </g>

  <g id="frame-3" transform="translate(384)">
    <use href="#dog-body"/>
    <path d="M39 84h13v19h9v9H39zM70 84h13v19h10v9H70z" fill="#ffffff"/>
  </g>
</svg>
